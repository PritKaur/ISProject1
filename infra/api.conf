<VirtualHost *:80>
    ServerName api.malcolmpritpalproject.me
    DocumentRoot /var/www/api
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/api_error.log
    CustomLog ${APACHE_LOG_DIR}/api_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName api.malcolmpritpalproject.me
    DocumentRoot /var/www/api
    SSLEngine on
    SSLCertificateFile      /etc/ssl/zerossl/api.crt
    SSLCertificateKeyFile   /etc/ssl/zerossl/api.key
    SSLCertificateChainFile /etc/ssl/zerossl/api-ca.crt
    ErrorLog ${APACHE_LOG_DIR}/api_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/api_ssl_access.log combined
</VirtualHost>
