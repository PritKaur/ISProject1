<VirtualHost *:80>
    ServerName malcolmpritpalproject.me
    ServerAlias www.malcolmpritpalproject.me
    DocumentRoot /var/www/isproject1
    <Directory /var/www/isproject1>
        AllowOverride All
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/isproject1_error.log
    CustomLog ${APACHE_LOG_DIR}/isproject1_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName malcolmpritpalproject.me
    ServerAlias www.malcolmpritpalproject.me
    DocumentRoot /var/www/isproject1
    <Directory /var/www/isproject1>
        AllowOverride All
        Require all granted
    </Directory>
    SSLEngine on
    SSLCertificateFile      /etc/ssl/zerossl/main.crt
    SSLCertificateKeyFile   /etc/ssl/zerossl/main.key
    SSLCertificateChainFile /etc/ssl/zerossl/main-ca.crt
    ErrorLog ${APACHE_LOG_DIR}/isproject1_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/isproject1_ssl_access.log combined
</VirtualHost>
