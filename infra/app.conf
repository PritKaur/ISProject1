<VirtualHost *:80>
    ServerName app.malcolmpritpalproject.me
    DocumentRoot /var/www/app
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/app_error.log
    CustomLog ${APACHE_LOG_DIR}/app_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName app.malcolmpritpalproject.me
    DocumentRoot /var/www/app
    SSLEngine on
    SSLCertificateFile      /etc/ssl/zerossl/app.crt
    SSLCertificateKeyFile   /etc/ssl/zerossl/app.key
    SSLCertificateChainFile /etc/ssl/zerossl/app-ca.crt
    ErrorLog ${APACHE_LOG_DIR}/app_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/app_ssl_access.log combined
</VirtualHost>
